  <rect width="1840" height="520" fill="#FFFFFF"/>
<g filter="url(#sh)">
  <rect x="20" y="26" width="360" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <path d="M 20 40 Q 20 26 34 26 L 366 26 Q 380 26 380 40 L 380 68 L 20 68 Z" fill="url(#gNavyHdr)"/>
  <text x="200.0" y="54.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Committed Run Records</text>
  <text x="38" y="96" fill="#334155" font-size="17.5" font-weight="normal">• Plan &amp; Method Summary</text>
  <text x="38" y="128" fill="#1D4ED8" font-size="17.5" font-weight="bold">• Validation Gain: effect in {+1, -1}</text>
  <text x="38" y="160" fill="#334155" font-size="17.5" font-weight="normal">• Diagnostic Traceback / Timeout</text>
  <text x="38" y="192" fill="#64748B" font-size="16.2" font-weight="normal">• Persisted in experience/records.json</text>
</g>
<g filter="url(#sh)">
  <rect x="20" y="260" width="360" height="205" rx="14" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
  <path d="M 20 274 Q 20 260 34 260 L 366 260 Q 380 260 380 274 L 380 302 L 20 302 Z" fill="url(#gTealHdr)"/>
  <text x="200.0" y="288.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Static Method Priors</text>
  <text x="38" y="330" fill="#1E293B" font-size="17.5" font-weight="normal">• method_catalog.yaml (by modality)</text>
  <text x="38" y="362" fill="#0F766E" font-size="17.5" font-weight="bold">• SHA-256 + forward_ok local cache</text>
  <text x="38" y="394" fill="#1E293B" font-size="17.5" font-weight="normal">• Task cards (counterexamples)</text>
  <text x="38" y="426" fill="#1D4ED8" font-size="17.5" font-weight="bold">• Orthogonal Draft 0/1/2 seeding</text>
</g>
<g filter="url(#sh)">
  <rect x="445" y="22" width="470" height="200" rx="14" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="2"/>
  <path d="M 445 36 Q 445 22 459 22 L 901 22 Q 915 22 915 36 L 915 64 L 445 64 Z" fill="url(#gPurpleHdr)"/>
  <text x="680.0" y="50.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Dense Semantic Index (Local CPU)</text>
  <text x="463" y="92" fill="#5B21B6" font-size="18.2" font-weight="bold">• Model: Qwen/Qwen3-Embedding-0.6B</text>
  <text x="463" y="125" fill="#334155" font-size="17.0" font-weight="normal">• 1024-d L2-normalized vectors (max_len=1024)</text>
  <text x="463" y="156" fill="#0F766E" font-size="17.2" font-weight="bold">• Cosine floor >= 0.35  |  Zero GPU contention</text>
  <text x="463" y="187" fill="#334155" font-size="17.2" font-weight="normal">• Captures cross-phrasing ML concepts</text>
</g>
<g filter="url(#sh)">
  <rect x="445" y="258" width="470" height="204" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <path d="M 445 272 Q 445 258 459 258 L 901 258 Q 915 258 915 272 L 915 300 L 445 300 Z" fill="url(#gBlueHdr)"/>
  <text x="680.0" y="286.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Sparse Lexical Index (Okapi BM25)</text>
  <text x="463" y="328" fill="#1D4ED8" font-size="17.5" font-weight="bold">• CamelCase + CJK Tokenizer (k1=1.5, b=0.75)</text>
  <text x="463" y="361" fill="#334155" font-size="15.6" font-weight="normal">• StratifiedKFold -> [stratifiedkfold, stratified, kfold]</text>
  <text x="463" y="392" fill="#1E293B" font-size="16.8" font-weight="bold">• Exact match on library &amp; exception symbols</text>
  <text x="463" y="423" fill="#475569" font-size="16.5" font-weight="normal">  (e.g., LGBMClassifier, ConvNeXt, CUDA OOM)</text>
</g>
<g filter="url(#sh)">
  <rect x="980" y="118" width="390" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
  <path d="M 980 132 Q 980 118 994 118 L 1356 118 Q 1370 118 1370 132 L 1370 160 L 980 160 Z" fill="url(#gGoldHdr)"/>
  <text x="1175.0" y="146.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Weighted RRF Rank Fusion</text>
  <text x="998" y="188" fill="#92400E" font-size="18.2" font-weight="bold">Reciprocal Rank Fusion:</text>
  <text x="998" y="222" fill="#112B5C" font-size="18.8" font-weight="bold">score(i) = 0.5 / (60 + r_kw)</text>
  <text x="998" y="254" fill="#112B5C" font-size="18.8" font-weight="bold">         + 0.5 / (60 + r_vec)</text>
  <text x="998" y="290" fill="#334155" font-size="17.2" font-weight="normal">• Scale-free rank combination</text>
  <text x="998" y="320" fill="#334155" font-size="17.2" font-weight="normal">• Graceful keyword fallback</text>
</g>
<g filter="url(#sh)">
  <rect x="1435" y="38" width="385" height="424" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
  <path d="M 1435 52 Q 1435 38 1449 38 L 1806 38 Q 1820 38 1820 52 L 1820 82 L 1435 82 Z" fill="url(#gNavyHdr)"/>
  <text x="1627.5" y="67.0" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">Evidence-Guided Planner</text>
  <text x="1453" y="110" fill="#112B5C" font-size="18.8" font-weight="bold">Dual Contrastive Context:</text>
  <text x="1453" y="146" fill="#0F766E" font-size="18.2" font-weight="bold">✓ Top-2 Positive Records (+1)</text>
  <text x="1453" y="174" fill="#475569" font-size="16.8" font-weight="normal">    Proven gains to build upon</text>
  <text x="1453" y="210" fill="#DC2626" font-size="18.2" font-weight="bold">✗ Top-2 Negative Records (-1)</text>
  <text x="1453" y="238" fill="#475569" font-size="16.5" font-weight="normal">    Prioritizes direct failed children</text>
  <text x="1453" y="276" fill="#1D4ED8" font-size="18.2" font-weight="bold">Outputs Experiment Plan:</text>
  <text x="1453" y="306" fill="#334155" font-size="17.0" font-weight="normal">• Autonomous component target</text>
  <text x="1453" y="334" fill="#334155" font-size="17.0" font-weight="normal">• AST-verified symbol + imports</text>
</g>
