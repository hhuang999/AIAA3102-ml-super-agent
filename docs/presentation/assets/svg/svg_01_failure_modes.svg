  <rect x="1404" y="292" width="398" height="172" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="1416" y="322" fill="#0F766E" font-size="18" font-weight="bold">SuperAgent Remedy:</text>
  <text x="1416" y="356" fill="#1E293B" font-size="18" font-weight="normal">✓ Task-hint + 1e-4 exact-hit disambig.</text>
  <text x="1416" y="390" fill="#1E293B" font-size="18" font-weight="normal">✓ Stratified two-half OOS gate</text>
  <text x="1416" y="424" fill="#1E293B" font-size="18" font-weight="normal">✓ Prob-sidecar + log_loss tie-break</text>
