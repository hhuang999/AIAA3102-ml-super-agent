  <text x="1416" y="114" fill="#991B1B" font-size="18" font-weight="bold">Problem:</text>
  <text x="1416" y="148" fill="#334155" font-size="18" font-weight="normal">• Binary metric ties (acc vs prec_macro)</text>
  <text x="1416" y="182" fill="#334155" font-size="18" font-weight="normal">• Hard 0/1 vote loses confidence</text>
  <text x="1416" y="216" fill="#334155" font-size="18" font-weight="normal">• Unvalidated blending overfits val</text>
