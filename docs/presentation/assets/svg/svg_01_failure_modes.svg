  <text x="504" y="114" fill="#991B1B" font-size="18" font-weight="bold">Problem:</text>
  <text x="504" y="148" fill="#334155" font-size="18" font-weight="normal">• Single-family drafts lack diversity</text>
  <text x="504" y="182" fill="#334155" font-size="18" font-weight="normal">• Naive hill-climbing stalls locally</text>
  <text x="504" y="216" fill="#334155" font-size="18" font-weight="normal">• Parallel workers repeat failed ideas</text>
  <line x1="691.0" y1="256" x2="691.0" y2="284" stroke="#0F766E" stroke-width="3" marker-end="url(#arrTeal)"/>
  <rect x="492" y="292" width="398" height="172" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="504" y="322" fill="#0F766E" font-size="18" font-weight="bold">SuperAgent Remedy:</text>
  <text x="504" y="356" fill="#1E293B" font-size="18" font-weight="normal">✓ Orthogonal family seeding (t = 0)</text>
  <text x="504" y="390" fill="#1E293B" font-size="18" font-weight="normal">✓ UCT &lt;-&gt; Elite + 7-op search tree</text>
  <text x="504" y="424" fill="#1E293B" font-size="18" font-weight="normal">✓ Contrastive (+1/-1) RRF memory</text>
</g>
<g filter="url(#sh)">
  <rect x="932" y="18" width="430" height="462" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 932 34 Q 932 18 948 18 L 1346 18 Q 1362 18 1362 34 L 1362 68 L 932 68 Z" fill="url(#gNavyHdr)"/>
  <text x="1147.0" y="50" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">3. Script Timeout Death Spiral</text>
  <rect x="948" y="84" width="398" height="168" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="960" y="114" fill="#991B1B" font-size="18" font-weight="bold">Problem:</text>
  <text x="960" y="148" fill="#334155" font-size="18" font-weight="normal">• Fast 15s baseline shrinks q0.8 limit</text>
  <text x="960" y="182" fill="#334155" font-size="18" font-weight="normal">• 20–32s cap kills 5-fold GBDT/NNs</text>
  <text x="960" y="216" fill="#334155" font-size="18" font-weight="normal">• 31/120 timeouts trigger repair loops</text>
  <line x1="1147.0" y1="256" x2="1147.0" y2="284" stroke="#0F766E" stroke-width="3" marker-end="url(#arrTeal)"/>
  <rect x="948" y="292" width="398" height="172" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="960" y="322" fill="#0F766E" font-size="18" font-weight="bold">SuperAgent Remedy:</text>
  <text x="960" y="356" fill="#1E293B" font-size="18" font-weight="normal">✓ Decouple priority vs kill ceiling</text>
  <text x="960" y="390" fill="#1E293B" font-size="18" font-weight="normal">✓ Crash-immune ok_script estimator</text>
  <text x="960" y="424" fill="#1E293B" font-size="18" font-weight="normal">✓ Slot-share floor (31 -> 1 timeout)</text>
</g>
<g filter="url(#sh)">
  <rect x="1388" y="18" width="430" height="462" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 1388 34 Q 1388 18 1404 18 L 1802 18 Q 1818 18 1818 34 L 1818 68 L 1388 68 Z" fill="url(#gNavyHdr)"/>
  <text x="1603.0" y="50" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">4. Fragile Metric &amp; Blind Fusion</text>
