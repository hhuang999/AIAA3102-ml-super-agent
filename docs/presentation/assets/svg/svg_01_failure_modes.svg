<g filter="url(#sh)">
  <rect x="20" y="18" width="430" height="462" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 20 34 Q 20 18 36 18 L 434 18 Q 450 18 450 34 L 450 68 L 20 68 Z" fill="url(#gNavyHdr)"/>
  <text x="235.0" y="50" text-anchor="middle" fill="#FFFFFF" font-size="19.5" font-weight="bold">1. Data &amp; Validation Leakage</text>
  <rect x="36" y="84" width="398" height="168" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="48" y="114" fill="#991B1B" font-size="18" font-weight="bold">Problem:</text>
  <text x="48" y="148" fill="#334155" font-size="18" font-weight="normal">• Pre-split scaling / target encoding</text>
  <text x="48" y="182" fill="#334155" font-size="18" font-weight="normal">• Tuning blend weights on val.csv</text>
  <text x="48" y="216" fill="#334155" font-size="18" font-weight="normal">• Unsealed test answer columns</text>
  <line x1="235.0" y1="256" x2="235.0" y2="284" stroke="#0F766E" stroke-width="3" marker-end="url(#arrTeal)"/>
  <rect x="36" y="292" width="398" height="172" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="48" y="322" fill="#0F766E" font-size="18" font-weight="bold">SuperAgent Remedy:</text>
  <text x="48" y="356" fill="#1E293B" font-size="18" font-weight="normal">✓ Physical private/ label firewall</text>
  <text x="48" y="390" fill="#1E293B" font-size="18" font-weight="normal">✓ Inner-CV only weight/threshold rule</text>
  <text x="48" y="424" fill="#1E293B" font-size="18" font-weight="normal">✓ AST &amp; jump-triggered leak audit</text>
</g>
<g filter="url(#sh)">
  <rect x="476" y="18" width="430" height="462" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
