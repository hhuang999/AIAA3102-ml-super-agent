[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent"
version = "0.7.1"
description = "Autonomous agent that develops classification models for a task directory"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["superagent*"]

[tool.setuptools.package-data]
superagent = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
