[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent"
version = "0.7.1"
description = "Autonomous agent that develops classification models for a task directory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "joblib>=1.2",
    "numpy>=1.26",
    "openai>=2.44,<3",
    "pandas>=2.1",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "tfrecord>=1.14.6",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0", "transformers>=4.51.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["superagent*"]

[tool.setuptools.package-data]
superagent = ["resources/*.yaml"]
