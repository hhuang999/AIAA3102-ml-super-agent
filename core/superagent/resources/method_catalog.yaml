# Method catalog: general modelling methods and locally available pretrained models,
# organised by data modality only. Entries never refer to particular tasks or datasets.
#
# Fields:
#   id           entry identifier
#   modality     image | text | tabular
#   pretrained   whether the entry needs pretrained weights
#   usage        frozen_features | finetune | in_context | from_scratch | classical
#   title, when_to_use, input_notes   shown to the model (keep them in English)
#   library      public library used to load / train it
#   hub_id       model id on the public model hub (pretrained snapshot entries only)
#   fetch        snapshot (download hub_id) | warmup (run `example` once to trigger the
#                library's own download); empty for non-pretrained entries
#   example      minimal loading / usage code
#
# To add or remove a method, edit this file only. Run `python -m superagent.fetch_models`
# afterwards so pretrained entries are available offline.

