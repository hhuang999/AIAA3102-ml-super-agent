- id: img_scratch_cnn
  modality: image
  pretrained: false
  usage: from_scratch
  title: "Small residual CNN trained from scratch with data augmentation"
  when_to_use: "Small images or many images; the main approach for images when pretrained models are not allowed."
  input_notes: "Compute normalisation mean and std from the training part only."
  library: "torch"
  hub_id: null
  fetch: null
  example: |
    import torch.nn as nn
    def block(cin, cout):
        return nn.Sequential(nn.Conv2d(cin, cout, 3, padding=1, bias=False), nn.BatchNorm2d(cout), nn.ReLU(inplace=True))
    class SmallResNet(nn.Module):
        def __init__(self, n_classes, in_ch=3):
            super().__init__()
            self.stem = block(in_ch, 64)
            self.layer1 = nn.Sequential(block(64, 128), nn.MaxPool2d(2))
            self.res1 = nn.Sequential(block(128, 128), block(128, 128))
            self.layer2 = nn.Sequential(block(128, 256), nn.MaxPool2d(2))
            self.head = nn.Sequential(nn.AdaptiveAvgPool2d(1), nn.Flatten(), nn.Dropout(0.3), nn.Linear(256, n_classes))
        def forward(self, x):
            x = self.layer1(self.stem(x))
            x = x + self.res1(x)
            return self.head(self.layer2(x))

