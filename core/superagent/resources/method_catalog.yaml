- id: text_tfidf_linear
  modality: text
  pretrained: false
  usage: classical
  title: "TF-IDF features (word and character n-grams) + linear model"
  when_to_use: "Strong baseline for any text task. Runs in seconds to minutes."
  input_notes: "Fit the vectorisers on the training part only. Logistic regression, linear SVM or naive Bayes all work."
  library: "scikit-learn"
  hub_id: null
  fetch: null
  example: |
    from scipy.sparse import hstack
    from sklearn.feature_extraction.text import TfidfVectorizer
    from sklearn.linear_model import LogisticRegression
    word = TfidfVectorizer(ngram_range=(1, 2), min_df=2, sublinear_tf=True)
    char = TfidfVectorizer(analyzer="char_wb", ngram_range=(2, 5), min_df=2, sublinear_tf=True)
    X_tr = hstack([word.fit_transform(texts_tr), char.fit_transform(texts_tr)]).tocsr()
    X_te = hstack([word.transform(texts_te), char.transform(texts_te)]).tocsr()
    clf = LogisticRegression(max_iter=3000, C=4.0).fit(X_tr, y_tr)
    proba = clf.predict_proba(X_te)

- id: text_scratch_nn
  modality: text
  pretrained: false
  usage: from_scratch
  title: "Small text network trained from scratch (word embeddings + CNN or BiGRU)"
  when_to_use: "Plenty of data (tens of thousands of documents) and pretrained models are not allowed."
  input_notes: "Build the vocabulary from the training part only."
  library: "torch"
  hub_id: null
  fetch: null
  example: |
    import torch, torch.nn as nn
    class TextCNN(nn.Module):
        def __init__(self, vocab_size, n_classes, dim=128):
            super().__init__()
            self.emb = nn.Embedding(vocab_size, dim, padding_idx=0)
            self.convs = nn.ModuleList([nn.Conv1d(dim, 128, k) for k in (3, 4, 5)])
            self.drop = nn.Dropout(0.3)
            self.fc = nn.Linear(128 * 3, n_classes)
        def forward(self, ids):
            x = self.emb(ids).transpose(1, 2)
            x = torch.cat([torch.relu(c(x)).amax(dim=2) for c in self.convs], dim=1)
            return self.fc(self.drop(x))

