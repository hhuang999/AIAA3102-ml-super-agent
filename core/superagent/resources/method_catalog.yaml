- id: tab_linear
  modality: tabular
  pretrained: false
  usage: classical
  title: "Linear model (logistic regression) with scaling and one-hot encoding"
  when_to_use: "Robust baseline when there are few samples or few features; also useful in combination with tree models."
  input_notes: "Standardise numeric features; fit the scaler on the training part only."
  library: "scikit-learn"
  hub_id: null
  fetch: null
  example: |
    from sklearn.compose import ColumnTransformer
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler
    pre = ColumnTransformer([("num", StandardScaler(), num_cols),
                             ("cat", OneHotEncoder(handle_unknown="ignore"), cat_cols)])
    clf = make_pipeline(pre, LogisticRegression(max_iter=2000, C=1.0))
    clf.fit(X_tr, y_tr)
    proba = clf.predict_proba(X_te)

