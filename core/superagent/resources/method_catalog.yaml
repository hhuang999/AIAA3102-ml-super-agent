- id: tab_mlp
  modality: tabular
  pretrained: false
  usage: from_scratch
  title: "Tabular neural network (categorical embeddings + MLP)"
  when_to_use: "Many rows (tens of thousands or more) with many categorical features; can be blended with tree models."
  input_notes: "Standardise numeric features; map categorical values to integers and embed them."
  library: "torch"
  hub_id: null
  fetch: null
  example: |
    import torch, torch.nn as nn
    class TabMLP(nn.Module):
        def __init__(self, n_num, cat_cards, n_classes, emb_dim=16, hidden=256):
            super().__init__()
            self.embs = nn.ModuleList([nn.Embedding(c + 1, emb_dim) for c in cat_cards])
            d = n_num + emb_dim * len(cat_cards)
            self.net = nn.Sequential(nn.Linear(d, hidden), nn.BatchNorm1d(hidden), nn.ReLU(), nn.Dropout(0.2),
                                     nn.Linear(hidden, hidden), nn.BatchNorm1d(hidden), nn.ReLU(), nn.Dropout(0.2),
                                     nn.Linear(hidden, n_classes))
        def forward(self, x_num, x_cat):
            parts = [x_num] + [e(x_cat[:, i]) for i, e in enumerate(self.embs)]
            return self.net(torch.cat(parts, dim=1))

- id: tab_tabicl_incontext
  modality: tabular
  pretrained: true
  usage: in_context
  title: "TabICL (tabular foundation model, no training needed)"
  when_to_use: "Small to medium tabular data. No tuning: one forward pass gives predictions. A good candidate next to gradient boosted trees."
  input_notes: "Works best with up to about 50,000 rows and about 100 features. Same interface as common classifiers: fit, then predict. The weights are fetched by the library on first use and are available offline here."
  library: "tabicl"
  hub_id: null
  fetch: warmup
  example: |
    import numpy as np
    from tabicl import TabICLClassifier
    X_tr = np.random.rand(200, 5); y_tr = (X_tr[:, 0] > 0.5).astype(int); X_te = np.random.rand(20, 5)
    clf = TabICLClassifier(n_estimators=4, device="cuda" if __import__("torch").cuda.is_available() else "cpu")
    clf.fit(X_tr, y_tr)
    proba = clf.predict_proba(X_te)
    print(proba.shape)

