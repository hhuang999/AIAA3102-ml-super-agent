# Turns off every search and control mechanism that has a switch, for comparison runs.
# The prompt additions (validation files, GPU habits, catalog pitfalls) are not affected.
control:
  controller: "static"
search:
  chain_soft_switch: false
  reward_mode: "chain_end"
plateau:
  count_failed_attempts: false
operators:
  synthesis:
    trigger_on_stagnation: false
execution:
  smoke_run: false
assessment:
  leak_check:
    jump_ratio: 0.0
llm:
  lower_effort_on_truncation: false
final:
  allow_ensemble: false
