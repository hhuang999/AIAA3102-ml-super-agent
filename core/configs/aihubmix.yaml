# Both models through AIHubMix (OpenAI-compatible endpoint). Put AIHUBMIX_API_KEY into the environment or
# a .env file in the start directory. Prices are per 1M tokens in USD; check the provider's model page.
llm:
  base_url: "https://aihubmix.com/v1"
  api_key_env: "AIHUBMIX_API_KEY"
  currency: "USD"
  generation:
    model: "deepseek-v4.1-flash-1017"
    reasoning_effort: "high"
    input_price_per_million: 0.155
    output_price_per_million: 0.62
  judgement:
    model: "deepseek-v4.1-flash-1017"
    input_price_per_million: 0.155
    output_price_per_million: 0.62
experience:
  vector:
    backend: "api"
    api_base_url: "https://aihubmix.com/v1"
    api_model: "qwen3-embedding-0.6b"
    api_key_env: "AIHUBMIX_API_KEY"
    price_per_million: 0.068
