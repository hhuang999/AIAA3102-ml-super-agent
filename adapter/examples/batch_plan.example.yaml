# Plan for `superagent_adapter.cli batch`. Paths are relative to this file.
core_python: /path/to/venv/bin/python
cwd: /path/to/dir/with/.env
options:
  time_limit_secs: 28800
  num_gpus: 1
  num_cpus: 12
  parallel: 2
  pretrained_mode: catalog
grader:
  mlebench_bin: mlebench
  data_dir: /path/to/mlebench/data
runs:
  - name: task_a_seed1
    task_dir: tasks/task_a
    output_dir: runs/task_a_seed1
    competition: task-a-competition-id
    options: {seed: 1, higher_is_better: false}
  - name: task_a_seed2
    task_dir: tasks/task_a
    output_dir: runs/task_a_seed2
    competition: task-a-competition-id
    options: {seed: 2, higher_is_better: false}
