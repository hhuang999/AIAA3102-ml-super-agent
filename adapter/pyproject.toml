[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-adapter"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["superagent_adapter*"]
